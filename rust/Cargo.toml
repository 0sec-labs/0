[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
nix = { version = "0.30", features = ["signal", "process", "user"] }
zero-protocol = { path = "crates/zero-protocol" }
zero-store = { path = "crates/zero-store" }
zero-executor = { path = "crates/zero-executor" }
zero-evidence = { path = "crates/zero-evidence" }
zero-source = { path = "crates/zero-source" }
zero-engine = { path = "crates/zero-engine" }
zero-provider = { path = "crates/zero-provider" }
zero-sandbox = { path = "crates/zero-sandbox" }
zero-smolvm = { path = "crates/zero-smolvm" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
