name: "0: Desktop macOS"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-macos.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/bun-compile.sh"
      - "scripts/smoke-desktop-macos.sh"
      - "packages/dashboard/**"
      - "packages/desktop/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/templates/**"

permissions:
  contents: read

concurrency:
  group: 0-desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # This protected Apple-silicon Mac mini holds desktop signing and keychain
    # access. Its bespoke label prevents the job landing on any other macOS
    # runner if one is added. Main/dispatch-only: never run untrusted PR code.
    runs-on: [self-hosted, macOS, ARM64, 0-mac-mini]
    timeout-minutes: 35
    env:
      ZERO_CHATGPT_ACCESS_TOKEN: ""
      ZERO_CHATGPT_OAUTH_REFRESH_TOKEN: ""
      ZERO_CHATGPT_ACCOUNT_ID: ""
      ZERO_CHATGPT_AUTH_FILE: "/tmp/0-ci-no-auth.json"
      ZERO_CODEX_AUTH_JSON_PATH: "/tmp/0-ci-no-auth.json"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      QWEN_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      KIMI_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard and CLI closure
        run: pnpm --filter @0/dashboard build && pnpm --filter "@0/cli..." build
      - name: Build Apple-silicon sidecar
        run: bash scripts/bun-compile.sh "" "dist-bin/0-darwin-arm64"
      - name: Build and test desktop boundary
        run: pnpm --filter @0/desktop build && pnpm --filter @0/desktop test
      - name: Package desktop application
        run: pnpm --filter @0/desktop package:mac
      - name: Smoke packaged sidecar
        run: bash scripts/smoke-desktop-macos.sh
      - name: Upload unsigned desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 0-desktop-macos-arm64
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
