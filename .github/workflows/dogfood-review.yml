name: "0sec: Dogfood Secure"

# The product secures itself through the same managed path customers use:
# after normal CI succeeds on main, this workflow asks 0cloud to run the
# secure lifecycle (investigate → reproduce → repair → verify) against the
# public repo. Nothing executes checkout-controlled code with credentials
# here — the cloud sandbox is the execution boundary, exactly as for
# customers. Findings, verified patches, and learning land in the cloud
# dashboard; this workflow only confirms the dispatch.
on:
  workflow_run:
    workflows: ["0sec: Main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 0sec-dogfood-secure-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      # Scoped CLI token (scans:dispatch) minted for the ops org. Never a
      # model or repo credential — the cloud holds those server-side.
      OSEC_CLOUD_TOKEN: ${{ secrets.DOGFOOD_CLOUD_TOKEN }}
      OSEC_CLOUD_HOST: "https://cloud.0.security"
      # Per-run cost ceiling the cloud enforces server-side.
      DOGFOOD_COST_CEILING_USD: "2"
    steps:
      - name: Dispatch secure run via 0cloud
        run: |
          set -euo pipefail
          test -n "$OSEC_CLOUD_TOKEN" || {
            echo "::error::DOGFOOD_CLOUD_TOKEN is required for the cloud dogfood lane."
            exit 1
          }
          payload="$(jq -nc --arg repo "https://github.com/${GITHUB_REPOSITORY}" --argjson ceiling "$DOGFOOD_COST_CEILING_USD" '{
            target: $repo,
            scan_mode: "secure",
            secure_config: {
              repo: $repo,
              test_command: "pnpm test:public",
              cost_ceiling_usd: $ceiling,
              rules: "minimal diffs; never weaken tests to pass; keep the public CLI surface stable"
            }
          }')"
          response="$(curl -fsS --retry 3 --retry-delay 2 \
            -X POST "$OSEC_CLOUD_HOST/api/scans" \
            -H "Authorization: Bearer $OSEC_CLOUD_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          scan_id="$(jq -r '.id' <<<"$response")"
          echo "Secure dogfood run dispatched: $OSEC_CLOUD_HOST/cloud/scans/$scan_id"
