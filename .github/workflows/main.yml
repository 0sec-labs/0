name: "0: Main"

on:
  push:
    # Repository branch pushes are authenticated before code can reach this
    # workflow. Fork PRs retain the protected public-PR policy-only lane.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: 0-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Fresh job-local storage avoids failures from the shared runner pool's full disk.
    runs-on: graphide
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is installed by Bootstrap runner, after Node is available.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Bootstrap runner
        run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
      - name: Provision FoxGuard binary
        env:
          INSTALL_DIR: ${{ runner.temp }}/0-tools/bin
        run: |
          bash "$GITHUB_WORKSPACE/scripts/provision-foxguard.sh"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package layering
        run: |
          pnpm check:architecture
          node --test scripts/check-architecture.test.mjs
      - name: Build CLI
        run: pnpm build
      - name: Check worker orchestration through built CLI
        run: bun scripts/check-worker-orchestration-bun.ts packages/cli/dist/index.js
      - name: Check custom provider model picker
        run: |
          pnpm --filter @0/engine exec playwright install --with-deps chromium
          node --test scripts/dashboard-model-catalog-cache.test.mjs scripts/dashboard-model-picker.test.mjs scripts/dashboard-custom-provider-models.test.mjs
      - name: Check CI report import in browser
        run: pnpm test:ci-report-browser
      - name: Check interactive console controls
        run: node --test scripts/dashboard-question-flow.test.mjs scripts/dashboard-task-progress.test.mjs scripts/dashboard-agents-panel.test.mjs scripts/dashboard-autonomy-modes.test.mjs
      - name: Check dashboard component suites
        run: pnpm test:dashboard
      - name: Check standalone installer
        run: node --test scripts/install-script.test.mjs
      - name: Check database initialization
        run: pnpm --filter @0/engine test
      - name: Check CLI documentation freshness
        run: pnpm docs:check
      - name: Check documented commands, flags, links and environment variables
        run: pnpm check:docs-commands
      - name: Type-check
        run: pnpm lint
      - name: Smoke CLI
        # Install the bundle's external SQLite/parser/browser dependencies in
        # the published layout before exercising command/script behavior.
        run: |
          (cd dist && npm install --omit=dev --no-audit --no-fund)
          node dist/0.js --help
          bash scripts/smoke-cli.sh "node dist/0.js"
      - name: Run tests
        run: pnpm test:public
        env:
          ZERO_CHATGPT_ACCESS_TOKEN: ""
          ZERO_CHATGPT_OAUTH_REFRESH_TOKEN: ""
          ZERO_CHATGPT_ACCOUNT_ID: ""
          ZERO_CODEX_AUTH_JSON_PATH: "/tmp/0-ci-no-auth.json"
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          QWEN_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
          KIMI_API_KEY: ""
          CLINE_API_KEY: ""
