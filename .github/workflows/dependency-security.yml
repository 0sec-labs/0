name: "0: Dependency Security"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install audit tooling
        run: python -m pip install uv==0.11.2 pip-audit==2.10.1
      - name: Export every locked Python extra
        run: uv export --directory 0verse --frozen --all-extras --no-emit-project --output-file "$RUNNER_TEMP/0verse-audit.txt"
      - name: Audit pinned Python dependencies
        # Audit metadata without installing or executing optional binary engines.
        run: pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/0verse-audit.txt"

  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high

  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: ${{ hashFiles('**/Cargo.lock') != '' }}
        with:
          toolchain: stable
      - name: Install cargo-deny
        if: ${{ hashFiles('**/Cargo.lock') != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Lockfiles retain disabled optional backends. Check every resolved
      # workspace feature and platform, without advisory exceptions.
      - name: Audit resolved Rust dependencies
        if: ${{ hashFiles('**/Cargo.lock') != '' }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            cargo deny --manifest-path "${lockfile%Cargo.lock}Cargo.toml" \
              --workspace --all-features --locked check advisories
          done < <(git ls-files -z -- Cargo.lock '**/Cargo.lock')
