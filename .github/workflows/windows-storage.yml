name: "0: Windows storage"
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check native NTFS privacy, artifacts and junction rejection
        working-directory: packages/core
        run: pnpm exec vitest run src/improvement/private-storage.test.ts src/improvement/private-storage.windows.test.ts
      - name: Check the Bun 1.3.14 standalone Windows runtime
        run: |
          bun build --compile scripts/check-windows-storage-bun.ts --outfile windows-storage-check.exe
          ./windows-storage-check.exe
