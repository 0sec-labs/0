name: "0: Windows storage"
# Windows runners bill at 2x, so this runs only when the code it exercises can
# have changed: the private-storage module and its tests, the Bun smoke script,
# the lockfile/engine manifest and this file. A weekly run catches drift in the
# windows-latest image, Bun and Node.
on:
  push:
    paths:
      - "packages/engine/src/improvement/**"
      - "packages/engine/package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-windows-storage-bun.ts"
      - ".github/workflows/windows-storage.yml"
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check native NTFS privacy, artifacts and junction rejection
        working-directory: packages/engine
        run: pnpm exec vitest run src/improvement/private-storage.test.ts src/improvement/private-storage.windows.test.ts
      - name: Check the Bun 1.3.14 standalone Windows runtime
        run: |
          bun build --compile scripts/check-windows-storage-bun.ts --outfile windows-storage-check.exe
          ./windows-storage-check.exe
