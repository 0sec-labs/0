name: "0: Docs"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/check-docs-site.mjs"
      - "scripts/diagnose-docs-routing.mjs"
      - "packages/cli/**"
      - "packages/shared/**"
      - "scripts/sync-cli-docs.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CLI registrations
        run: pnpm --filter '@0/cli...' build
      - name: Check CLI documentation freshness
        run: pnpm docs:check
      - run: pnpm --filter @0/docs build
      - name: Check built documentation links
        run: node scripts/check-docs-site.mjs --write-marker
      # Resolve the existing project by its public domain, then publish to
      # its production branch. Do not silently create an unattached project.
      - name: Resolve public docs Pages project
        id: docs-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e84b55c82d29ff76b789af0aea3d9121
        run: node scripts/diagnose-docs-routing.mjs
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e84b55c82d29ff76b789af0aea3d9121
        run: |
          npx --yes wrangler@4 pages deploy docs/dist --project-name="${{ steps.docs-project.outputs.project_name }}" --branch="${{ steps.docs-project.outputs.production_branch }}"
      - name: Verify public documentation deployment
        run: node scripts/check-docs-site.mjs --live
