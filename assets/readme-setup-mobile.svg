<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1020" viewBox="0 0 600 1020" fill="none" role="img" aria-labelledby="title desc"><title id="title">Three ways to use 0</title><desc id="desc">Run 0 locally with your model provider, connect a coding agent through CLI or MCP, or join the 0cloud waitlist.</desc><defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#1f2026"/><stop offset="1" stop-color="#111216"/></linearGradient></defs><g transform="translate(16 16)"><rect x="1" y="1" width="566" height="314" rx="20" fill="url(#card)" stroke="#37373c"/><text x="28" y="43" fill="#ffad7b" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">01 / AVAILABLE NOW</text><g transform="translate(0 72)"><rect x="30" y="0" width="118" height="70" rx="8" fill="#101114" stroke="#63616a"/><path d="m47 24 10 9-10 9m22 0h26" stroke="#ffad7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="41" cy="10" r="2" fill="#97949d"/><circle cx="49" cy="10" r="2" fill="#97949d"/><circle cx="57" cy="10" r="2" fill="#97949d"/></g><text x="28" y="184" fill="#fcfaf6" font-size="32" font-weight="600" letter-spacing="-1" font-family="Arial,sans-serif">0 locally</text><text x="28" y="218" fill="#efc5aa" font-size="18" font-family="Arial,sans-serif">Your models. Your workspace.</text><text x="28" y="254" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">Run reviews, research, and</text><text x="28" y="279" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">verification from your terminal.</text></g><g transform="translate(16 348)"><rect x="1" y="1" width="566" height="314" rx="20" fill="url(#card)" stroke="#37373c"/><text x="28" y="43" fill="#ffad7b" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">02 / CLI + MCP</text><g transform="translate(0 72)"><path d="M53 36h34m36 0h34" stroke="#ffad7b" stroke-width="2"/><rect x="28" y="14" width="42" height="44" rx="9" fill="#26202a" stroke="#8f7399"/><rect x="88" y="14" width="42" height="44" rx="9" fill="#332723" stroke="#ffad7b"/><rect x="148" y="14" width="42" height="44" rx="9" fill="#26202a" stroke="#8f7399"/><path d="m42 30-6 6 6 6m14-12 6 6-6 6m48-12 10 6-10 6m57-12 6 6-6 6" stroke="#e7dce9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="184" fill="#fcfaf6" font-size="32" font-weight="600" letter-spacing="-1" font-family="Arial,sans-serif">Your coding agent</text><text x="28" y="218" fill="#efc5aa" font-size="18" font-family="Arial,sans-serif">Security tools inside your agent.</text><text x="28" y="254" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">Connect through MCP or invoke</text><text x="28" y="279" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">the CLI from your existing tools.</text></g><g transform="translate(16 680)"><rect x="1" y="1" width="566" height="314" rx="20" fill="url(#card)" stroke="#37373c"/><text x="28" y="43" fill="#ffad7b" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">03 / JOIN THE WAITLIST</text><g transform="translate(0 72)"><path d="M56 57h96a20 20 0 0 0 0-40 32 32 0 0 0-60-6 24 24 0 0 0-36 46Z" fill="#2d232a" stroke="#ffad7b" stroke-width="2"/><path d="M83 39h43m-34-9h24" stroke="#d1afbf" stroke-width="2" stroke-linecap="round"/></g><text x="28" y="184" fill="#fcfaf6" font-size="32" font-weight="600" letter-spacing="-1" font-family="Arial,sans-serif">0cloud</text><text x="28" y="218" fill="#efc5aa" font-size="18" font-family="Arial,sans-serif">Let the hosted service run it.</text><text x="28" y="254" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">Managed security workflows</text><text x="28" y="279" fill="#b8b6be" font-size="18" font-family="Arial,sans-serif">for your team’s repositories.</text></g></svg>