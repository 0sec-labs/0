<svg xmlns="http://www.w3.org/2000/svg" width="420" height="234" viewBox="0 0 420 234" role="img" aria-labelledby="title"><title id="title">0cloud: connect a pull request, investigate security issues, review and apply fixes</title><style></style><rect x="20" y="10" width="380" height="58" rx="8" fill="#F6F8FA" stroke="#D1D9E0"/><text x="36" y="34" fill="#FD802E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" >01</text><text x="68" y="34" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">PULL REQUEST</text><text x="36" y="56" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Connect your GitHub repository</text><path d="M210 71v17m-4-4 4 4 4-4" fill="none" stroke="#59636E"/><rect class="phase phase-0" x="20" y="10" width="380" height="58" rx="8" fill="none" stroke="#FD802E" opacity=".5"/><rect x="20" y="88" width="380" height="58" rx="8" fill="#F6F8FA" stroke="#D1D9E0"/><text x="36" y="112" fill="#FD802E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" >02</text><text x="68" y="112" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">SECURITY REVIEW</text><text x="36" y="134" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Scan, investigate, test</text><path d="M210 149v17m-4-4 4 4 4-4" fill="none" stroke="#59636E"/><rect class="phase phase-1" x="20" y="88" width="380" height="58" rx="8" fill="none" stroke="#FD802E" opacity=".5"/><rect x="20" y="166" width="380" height="58" rx="8" fill="#F6F8FA" stroke="#D1D9E0"/><text x="36" y="190" fill="#FD802E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" >03</text><text x="68" y="190" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">AUTOFIX</text><text