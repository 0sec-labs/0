<svg xmlns="http://www.w3.org/2000/svg" width="900" height="94" viewBox="0 0 900 94" role="img" aria-labelledby="title"><title id="title">0cloud: connect a pull request, investigate security issues, review and apply fixes</title><style>@keyframes phase{0%,30%,100%{opacity:0}5%,25%{opacity:.85}}.phase{animation:phase 9s ease-in-out infinite}.phase-1{animation-delay:3s}.phase-2{animation-delay:6s}@media(prefers-reduced-motion:reduce){.phase{animation:none;opacity:.5}}</style><rect x="20" y="12" width="256" height="66" rx="8" fill="#161B22" stroke="#30363D"/><text x="36" y="36" fill="#FD802E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" >01</text><text x="68" y="36" fill="#F0EEE9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">PULL REQUEST</text><text x="36" y="58" fill="#9DA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Connect your GitHub repository</text><path d="M286 45h26m-5-4 5 4-5 4" fill="none" stroke="#9DA5B1"/><rect class="phase phase-0" x="20" y="12" width="256" height="66" rx="8" fill="none" stroke="#FD802E" opacity="0"/><rect x="322" y="12" width="256" height="66" rx="8" fill="#161B22" stroke="#30363D"/><text x="338" y="36" fill="#FD802E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" >02</text><text x="370" y="36" fill="#F0EEE9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">SECURITY REVIEW</text><text x="338" y="58" fill="#9DA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Scan, investigate, test</text><path d="M588 45h26m-5-4 5 4-5 4" fill="none" stroke="#9DA5B1"/><rect class="phase phase-1" x="322" y="12" width="256" height="66" rx="8" fill="none" stroke="#FD802E" opacity="0"/><rect x="624" y="12" width="256" height="66" rx="8" fill="#161B22" stroke="#30363D"/><text x="640" y="36" fill="#FD802E" font-famil