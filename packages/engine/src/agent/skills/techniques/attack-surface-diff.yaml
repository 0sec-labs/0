id: attack-surface-diff
name: "Attack Surface Diff"
description: "Re-map the in-scope external surface (hosts, ports, endpoints, certificates, technologies) passively and compare it with the previous snapshot kept in notes, reporting only new exposure."
version: 1
applicable_roles:
  - attack
  - audit
tags:
  - attack-surface
  - recon
  - monitoring
  - sentinel
triggers:
  - "attack.?surface"
  - "new (host|subdomain|endpoint|port)s?"
  - "surface (diff|change)"
estimated_tokens: 400
content: |
  ## Attack surface diff

  ### Stay in scope and passive
  - Enumerate only domains and ranges listed in scope. Skip anything out of scope and log it as skipped.
  - Passive and low-rate discovery only: DNS, certificate transparency, public banners, sitemap and robots, a single request per known endpoint.

  ### Compare, then report
  - Read the last snapshot from NOTES.md or reports/. Record the new snapshot as a compact list (host, port, service, notable headers).
  - Report only deltas: new hosts, newly open ports, new endpoints, expired or mismatched certificates, removed protections.
  - For each new exposure give likely owner, why it matters, and a recommended next step. Do not exploit anything.
