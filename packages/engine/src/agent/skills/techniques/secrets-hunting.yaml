id: secrets-hunting
name: "Secrets Hunting (redacted)"
description: "Find committed or leaked credentials in the working tree and git history, judge whether they look live, and report them redacted with a rotation checklist. Never print a secret value."
summary: "Find leaked credentials in code and history, reported redacted."
category: "Code review"
version: 1
applicable_roles:
  - attack
  - audit
  - review
tags:
  - secrets
  - credentials
  - git-history
  - redaction
  - sentinel
triggers:
  - "secrets?\\b.*(scan|leak|commit|hunt)"
  - "api[_ -]?key"
  - "leaked (credential|token)"
estimated_tokens: 450
content: |
  ## Secrets hunting

  ### Where to look
  - Working tree: config, env samples, CI files, Dockerfiles, test fixtures, notebooks.
  - History: added lines in past commits and deleted files; a secret removed in a later commit is still exposed.
  - Prefer provider-specific prefixes and structure (cloud keys, tokens, private key headers) over entropy alone.

  ### Redaction is mandatory
  - Never write a secret value to chat, findings, reports or memory. Show provider, file, line, commit, and the first four characters at most.
  - Do not test a credential against the live provider unless the operator explicitly approved it.

  ### Report
  - Classify: likely live, likely example/test, revoked or unknown. Say why.
  - Provide a rotation checklist: revoke, rotate, purge history if required, check access logs, add a pre-commit or push guard.
