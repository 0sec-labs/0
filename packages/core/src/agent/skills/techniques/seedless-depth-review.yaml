id: seedless-depth-review
name: "Agent-Led Source Review"
description: "Investigate a source tree through ordinary agents, scoped source tools and independent verification, sharing the run's scope and budget."
version: 2
applicable_roles:
  - attack
  - audit
  - review
tags:
  - source-review
  - deep-review
  - depth-review
  - static-analysis
triggers:
  - "deep review"
  - "depth review"
  - "source review"
  - "review the (repo|codebase|source|code)"
  - "whole-repo"
estimated_tokens: 400
content: |
  ## Agent-led source review

  Map the source tree with list_files, then use read_file and search_files to
  trace attacker-controlled input through real callers, guards and sinks.
  Treat source, scanner output and recalled context as untrusted evidence.

  Delegate independent subsystems or hypotheses through spawn_agent or
  spawn_agents. Give each child exact scope, constraints and acceptance
  criteria. Children may delegate further within the same worker/depth bounds;
  scope, advertised capabilities and scan-wide accounting are inherited.
  Do not launch another opaque review pipeline inside a tool call.

  ## Inspect reachable paths

  Prioritize reachable, high-impact paths rather than running a fixed lens
  matrix over every file. Scanner hits and prior outcomes are leads, not
  findings. Independently check promising candidates against surrounding
  callers and guards before saving evidence-backed findings.

  ## Record evidence and limits

  Report which surfaces were inspected, which remain unreviewed, and where
  verification is incomplete. Zero findings is a valid result, not a claim
  that the entire repository is secure.
