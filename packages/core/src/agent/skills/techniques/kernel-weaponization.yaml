content: |
  ## Kernel exploit weaponization (disposable VM only)

  `weaponize_kernel` runs the kernel-exploit weaponization ladder: it takes a
  candidate kernel bug and climbs from a crash/oops toward a controllable
  primitive (leak → write → control flow → privilege escalation), iterating in
  a bounded loop.

  ### It only runs in a disposable kernel VM
  This engine builds and executes exploit code against a KERNEL. It NEVER runs
  against a live host or the operator's machine — only inside a throwaway
  kernel VM that is discarded afterward. This is not optional; it is how the
  capability is safe to offer at all.

  ### Deny-by-default gating (three layers)
  1. An explicit feature flag (`0SEC_FEATURE_KERNEL_WEAPONIZE=1`) — off by
     default.
  2. An active engagement scope.
  3. Kernel-VM artifacts must be PRESENT. When the VM image / kernel assets are
     absent the tool refuses rather than pretending to run — there is nowhere
     safe to execute, so it denies.
  If any layer is missing the tool is not available; that is the intended,
  correct behaviour, not a bug to work around.

  ### How to drive it
  - Provide the crash/bug input the ladder starts from (the candidate finding /
    reproducer) and let the ladder climb. Bound the iteration; treat each rung
    as a checkpoint.

  ### Reading the result
  - Success means a primitive was demonstrated INSIDE THE VM. That is a
    reproduced kernel finding, not a deployed exploit. Report the primitive and
    the reproduction environment; never point this at production.
