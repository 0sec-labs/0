content: |
  ## LLM / agent safety evaluation (live endpoint)

  `safety_eval` red-teams a real LLM or agent endpoint: it sends a battery of
  adversarial prompts and scores the responses for safety failures — direct
  jailbreaks, compliance with harmful requests, susceptibility to prompt
  injection, and unsafe tool/agency use.

  ### Scope gate (read this first)
  This tool sends prompts to a live model/agent ENDPOINT. It is offered ONLY
  when an engagement scope is active and the target endpoint is in scope.
  Without a scope it is not available; do not point it at a third-party model
  the engagement does not authorize.

  ### How to drive it
  - Point it at the in-scope target endpoint and run the adversarial suite. The
    engine sends the prompts, collects responses, and scores each against the
    safety criteria.

  ### Reading the result
  - A failure is a case where the endpoint produced unsafe output or was
    steered off its guardrails. Capture the exact prompt + response as evidence
    — reproducibility is what makes a safety finding actionable.
  - Passing the suite means the endpoint resisted THESE prompts, not that it is
    unjailbreakable. Treat the score as coverage of the tested vectors, not a
    safety certificate.

  ### Related
  - For injection specifically against an application's LLM feature, pair with
    the `llm-prompt-injection` skill; `safety_eval` is the broad adversarial
    battery against the endpoint itself.
