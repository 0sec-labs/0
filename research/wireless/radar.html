<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>0 BLE Radar — passive nearby-device map</title>
<style>
  body { background:#0a0e12; color:#cfe3ff; font-family:ui-monospace,Menlo,monospace; margin:0; display:flex; }
  #radar { flex:1; }
  #side { width:340px; padding:14px; border-left:1px solid #1d2a38; overflow-y:auto; height:100vh; box-sizing:border-box; }
  h1 { font-size:15px; color:#7fd4ff; margin:0 0 6px; }
  .sub { color:#5b7488; font-size:11px; margin-bottom:10px; }
  .dev { font-size:11px; margin:3px 0; padding:4px 6px; border-radius:6px; background:#101820; }
  .dev b { color:#fff; }
  .alert { background:#2a0f12; border:1px solid #ff5a6a; color:#ffb3ba; }
  canvas { display:block; }
  textarea { width:100%; height:70px; background:#101820; color:#cfe3ff; border:1px solid #1d2a38; border-radius:6px; font-family:inherit; font-size:11px; }
  button { margin-top:6px; background:#12354a; color:#7fd4ff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-family:inherit; }
  .match { background:#2a2408; border:1px solid #ffd35a; color:#ffe9a8; }
</style>
</head>
<body>
<canvas id="radar" width="900" height="900"></canvas>
<div id="side">
  <h1>◉ 0 BLE RADAR — passive</h1>
  <div class="sub" id="stats">listening…</div>
  <div style="margin:10px 0">
    <div class="sub">AirDrop identity crack — candidates (phones/emails):</div>
    <textarea id="cands" placeholder="+41790001234&#10;someone@example.com"></textarea>
    <button onclick="crack()">⚡ crack captured hashes</button>
    <div class="sub" style="margin-top:8px">Range brute-force over numbering plan:</div>
    <input id="rprefix" value="+4179" style="width:70px;background:#101820;color:#cfe3ff;border:1px solid #1d2a38;border-radius:6px;padding:4px">
    <input id="rwidth" value="7" style="width:40px;background:#101820;color:#cfe3ff;border:1px solid #1d2a38;border-radius:6px;padding:4px">
    <button onclick="cr2()">📡 brute range</button>
    <label style="font-size:11px;color:#7fd4ff"><input type="checkbox" id="autocrack" checked> auto-crack live (5s)</label>
    <div id="crackout"></div>
  </div>
  <div id="list"></div>
</div>
<script>
const cv = document.getElementById('radar'), ctx = cv.getContext('2d');
const CX=450, CY=450;
const RING_M = [3,10,25];
const COLORS = {FindMy:'#ff5a6a', ProximityPairing:'#ffab40', Handoff:'#64b5f6', NearbyInfo:'#42a5f5',
                NearbyAction:'#26c6da', AirDrop:'#ce93d8', iBeacon:'#81c784', HeySiri:'#b0bec5',
                AirPrint:'#a1887f', HotspotSource:'#fff176', HotspotTarget:'#fff176'};
const state = {tracks:[], smooth:{}};

function hash01(s){let h=0;for(const c of s){h=(h*31+c.charCodeAt(0))>>>0;}return (h%1000)/1000;}
function distM(rssi){return Math.max(0.5, Math.pow(10,(-59-rssi)/20));}
function maxM(){return 30;}
function rOf(m){return (m/maxM())*(CX-60);}

function draw(t){
  ctx.fillStyle='#0a0e12'; ctx.fillRect(0,0,900,900);
  // rings
  ctx.font='11px ui-monospace';
  for(const m of RING_M){
    ctx.strokeStyle='#1d2a38'; ctx.beginPath(); ctx.arc(CX,CY,rOf(m),0,7); ctx.stroke();
    ctx.fillStyle='#3a5165'; ctx.fillText(m+'m', CX+rOf(m)+4, CY-4);
  }
  ctx.strokeStyle='#25384a'; ctx.beginPath(); ctx.moveTo(CX,40); ctx.lineTo(CX,860); ctx.moveTo(60,CY); ctx.lineTo(840,CY); ctx.stroke();
  ctx.fillStyle='#7fd4ff'; ctx.fillText('◉ this Mac', CX-24, CY+14);

  // sweep
  const a = t/25 % (Math.PI*2);
  const g = ctx.createConicGradient ? null : null;
  ctx.strokeStyle='rgba(127,212,255,0.35)'; ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+Math.cos(a)*(CX-40), CY+Math.sin(a)*(CX-40)); ctx.stroke();

  for(const d of state.tracks){
    const m = distM(d.best);
    const ang = hash01(d.mac)*Math.PI*2;
    const x = CX + Math.cos(ang)*rOf(Math.min(m, maxM()));
    const y = CY + Math.sin(ang)*rOf(Math.min(m, maxM()));
    let s = state.smooth[d.mac] || {x,y};
    s.x = s.x*0.8 + x*0.2; s.y = s.y*0.8 + y*0.2;
    state.smooth[d.mac]=s;
    const cat = d.labels[0] || 'other';
    const col = COLORS[cat] || '#78909c';
    const alert = d.labels.includes('FindMy') && d.best >= -55;
    const match = d.match;
    const rhit = d.rangeHit;
    // pulse for alerts/matches
    const pr = alert||match||rhit ? 6+3*Math.sin(t/8) : 0;
    const ICONS = {FindMy:'📍', ProximityPairing:'🎧', Handoff:'🔗', NearbyInfo:'📶',
                   NearbyAction:'⚡', AirDrop:'🌀', iBeacon:'🛰', HeySiri:'🎙',
                   AirPrint:'🖨', HotspotSource:'📶', HotspotTarget:'📡'};
    const icon = ICONS[cat] || '•';
    ctx.font = '14px ui-monospace';
    ctx.fillStyle = match ? '#ffd35a' : (rhit ? '#ffab40' : (alert ? '#ff8a97' : col));
    ctx.fillText(icon, s.x-7, s.y+5);
    ctx.font='11px ui-monospace';
    if(pr) { ctx.strokeStyle = match ? '#ffd35a' : (rhit ? '#ffab40' : '#ff5a6a'); ctx.beginPath(); ctx.arc(s.x,s.y,4+6+pr,0,7); ctx.stroke(); }
    const det = (d.details||[]).join(' ');
    const important = !!(match || alert || rhit || d.name) || (d.best >= -60 && det.length);
    if(important){
      ctx.fillStyle = match ? '#ffd35a' : (rhit ? '#ffd8a8' : (alert ? '#ffb3ba' : '#cfe3ff'));
      const label = match ? (match.candidate + (d.name?' @'+d.name:''))
        : rhit ? ('# '+rhit)
        : (alert ? '⚠ FindMy '+d.name : '');
      const line2 = det ? det.slice(0,30) : '';
      if(label) ctx.fillText(label.slice(0,26), s.x+8, s.y+3);
      if(line2) { ctx.fillStyle='#5b7488'; ctx.fillText(line2, s.x+8, s.y+15); }
      if(!label && line2) { ctx.fillStyle='#cfe3ff'; ctx.fillText(line2, s.x+8, s.y+3); }
    }
  }
  requestAnimationFrame(step);
}
let t0=performance.now();
function step(){ draw(performance.now()-t0); }

async function poll(){
  try{
    const r = await fetch('/api/state'); const j = await r.json();
    state.tracks = j.tracks; window.selfCands = (j.self || []);
    const named = j.tracks.filter(d=>d.name).length;
    document.getElementById('stats').textContent =
      `${j.tracks.length} devices · ${named} named · FindMy:${j.tracks.filter(d=>d.labels.includes('FindMy')).length}`;
    document.getElementById('list').innerHTML = j.tracks.slice(0,40).map(d=>{
      const cls = d.labels.includes('FindMy') && d.best>=-55 ? 'dev alert' : 'dev';
      return `<div class="${cls}"><b>${d.name||'unnamed'}</b> · ${d.best}dB · ${d.labels.join(',')||'-'}</div>`;
    }).join('');
  }catch(e){}
  setTimeout(poll, 1500);
}
async function crack(){
  const cands = document.getElementById('cands').value.split('\n').filter(s=>s.trim());
  const r = await fetch('/api/crack', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({candidates:cands})});
  const j = await r.json();
  state.tracks.forEach(d=>delete d.match);
  for(const m of j.matches){
    const d = state.tracks.find(t=>t.mac===m.mac);
    if(d) d.match = m;
  }
  document.getElementById('crackout').innerHTML = j.matches.length
    ? j.matches.map(m=>`<div class="dev match">🎯 ${m.mac.slice(0,8)} == <b>${m.candidate}</b></div>`).join('')
    : `<div class="dev">no matches (${j.scanned} devices scanned)</div>`;
}
async function cr2(){
  const prefix = document.getElementById('rprefix').value.trim();
  const width = parseInt(document.getElementById('rwidth').value)||7;
  document.getElementById('crackout').innerHTML = `<div class="dev">brute-forcing ${prefix} × 10^${width} …</div>`;
  const r = await fetch('/api/crack_range', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prefix, width})});
  const j = await r.json();
  const rows = Object.entries(j.windows||{}).map(([w,v])=>
    `<div class="dev">hash ${w}: ${v.total} candidates — e.g. ${v.candidates.slice(0,4).join(', ')}</div>`).join('');
  document.getElementById('crackout').innerHTML =
    (j.devices===0) ? `<div class="dev">no AirDrop beacons captured</div>`
    : `<div class="dev">${j.devices} device(s) · candidate sets (2-byte truncation = ambiguous):</div>` + rows;
}
let autoTimer = null;
function toggleAuto(){
  if(autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if(document.getElementById('autocrack').checked){
    autoTimer = setInterval(async () => {
      try {
        const typed = document.getElementById('cands').value.split('\n').filter(s=>s.trim());
        const cands = typed.length ? typed : (window.selfCands || []);
        if(cands.length){
          const r = await fetch('/api/crack', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({candidates:cands})});
          const j = await r.json();
          state.tracks.forEach(d=>delete d.match);
          for(const m of j.matches){
            const d = state.tracks.find(t=>t.mac===m.mac);
            if(d) d.match = m;
          }
          if(j.matches.length){
            document.getElementById('crackout').innerHTML =
              '<div class="dev match">🎯 LIVE: ' + j.matches.map(m=>`${m.mac.slice(0,8)} == <b>${m.candidate}</b>`).join(' · ') + '</div>';
          } else if(!typed.length){
            document.getElementById('crackout').innerHTML =
              '<div class="dev">self-crack: ' + (window.selfCands||[]).join(', ') + ' — awaiting own-device beacon…</div>';
          }
        }
        const rp = document.getElementById('rprefix').value.trim();
        const rw = parseInt(document.getElementById('rwidth').value)||7;
        const rr = await fetch('/api/crack_range', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prefix:rp, width:Math.min(rw,6)})});
        const rj = await rr.json();
        for(const [w,v] of Object.entries(rj.windows||{})){
          for(const t of state.tracks){
            if((t.airdrop||[]).some(h=>h.includes(w))){
              t.rangeHit = v.candidates.slice(0,3).join(' ');
            }
          }
        }
      } catch(e) {}
    }, 5000);
  }
}
toggleAuto();
poll(); requestAnimationFrame(step);
</script>
</body>
</html>
